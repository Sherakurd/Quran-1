<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>قورئانی پیرۆز</title>
    <style>
        @font-face {
            font-family: 'Rudaw';
            src: url('https://raw.githubusercontent.com/username/repository/main/RudawRegular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary: #1b4332;
            --secondary: #2d6a4f;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2d3748;
        }
        body {
            font-family: 'Rudaw', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            direction: rtl;
            padding-bottom: 110px;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        .selector-box {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: var(--secondary);
            display: block;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            background: #fff;
            font-family: 'Rudaw', sans-serif;
        }
        .surah-card {
            background: var(--card-bg);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .surah-card:active {
            transform: scale(0.98);
        }
        .surah-info h3 {
            margin: 0 0 4px 0;
            font-size: 17px;
        }
        .surah-info p {
            margin: 0;
            color: #718096;
            font-size: 13px;
        }
        .surah-number {
            background-color: #e8f5e9;
            color: var(--secondary);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 12px 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }
        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>

        function renderSurahs() {
            listContainer.innerHTML = '';
            surahs.forEach(surah => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.innerHTML = `
                    <div class="surah-info">
                        <h3>سُورَةُ ${surah.name}</h3>
                        <p>${surah.type} • ژمارەی ئایەت: ${surah.ayahs}</p>
                    </div>
                    <div class="surah-number">${surah.number}</div>
                `;
                card.onclick = () => playSurah(surah);
                listContainer.appendChild(card);
            });
        }

        function playSurah(surah) {
            const serverUrl = reciterSelect.value;
            let formattedNum = String(surah.number).padStart(3, '0');
            const audioUrl = `${serverUrl}/${formattedNum}.mp3`;
            
            playingTitle.innerText = `سُورَةُ ${surah.name}`;
            audioPlayer.src = audioUrl;
            playerBar.style.display = 'flex';
            audioPlayer.play();
        }

            audioPlayer.pause();
            playerBar.style.display = 'none';
        };
