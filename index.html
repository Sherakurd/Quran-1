<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قورئانی پیرۆز</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>قورئانی پیرۆز</h1>
        <p>گوێبیست بن و بخوێنن بە ئاسانی</p>
        <div class="search-box">
            <input type="text" id="search" placeholder="گەڕان بەدوای سورەتدا..." onkeyup="searchSurah()">
        </div>
    </header>

    <main class="container">
        <div id="surahs-list" class="grid">
            </div>
    </main>

    <div id="audio-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeAudio()">&times;</span>
            <h2 id="modal-title">ناوی سورەت</h2>
            <audio id="audio-player" controls autoplay style="width: 100%; margin-top: 15px;">
                پێکهاتەی دەنگ لە وێبگەڕەکەتدا کار ناکات.
            </audio>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
