<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>قورئانی پیرۆز - موسحەفی مەدینە</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1a1a1a;
            --text-color: #e2e8f0;
            --accent-color: #d4af37;
            --btn-bg: #2d6a4f;
            --page-bg: #ffffff;
        }
        body.sepia {
            --bg-color: #f4ecd8;
            --panel-bg: #e6dcbe;
            --text-color: #2c221e;
            --accent-color: #8c6d46;
            --btn-bg: #8c6d46;
            --page-bg: #fffdf9;
        }
        body.light {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #1b4332;
            --btn-bg: #2d6a4f;
            --page-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            direction: rtl;
            padding-bottom: 150px;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background-color: var(--panel-bg);
            color: var(--accent-color);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .controls-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        select, button.control-btn {
            background: rgba(255,255,255,0.08);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .quran-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            max-width: 600px;
            margin: auto;
        }
        .page-view-box {
            background: var(--page-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 560px;
            position: relative;
        }
        .quran-page-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .page-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
        }
        .nav-btn {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .nav-btn:active {
            transform: scale(0.96);
        }
        .page-indicator-box {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .page-indicator {
            background: var(--panel-bg);
            color: var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .jump-input {
            width: 50px;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: var(--panel-bg);
            color: var(--text-color);
            font-weight: bold;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }
        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--accent-color);
        }
        audio {
            width: 100%;
            outline: none;
            height: 36px;
        }
    </style>
</head>
<body class="dark">

    <header>
        <span>قورئانی پیرۆز</span>
        <div class="controls-group">
            <select id="themeSelect" onchange="changeTheme()">
                <option value="dark">تاریک</option>
                <option value="sepia">کاغەزی (سەپیە)</option>
                <option value="light">ڕووناک</option>
            </select>
            <select id="reciterSelect" onchange="updateAudio()">
                <option value="https://www.everyayah.com/data/Minshawy_Teacher_128kbps/">منشاوی (موعەلم)</option>
                <option value="https://www.everyayah.com/data/Husary_Teacher_128kbps/">حەسری (موعەلم)</option>
                <option value="https://www.everyayah.com/data/Alafasy_128kbps/">میشاری العفاسی</option>
                <option value="https://www.everyayah.com/data/Abdul_Basit_Murattal_192kbps/">عبدالباسط عبدالصمد</option>
                <option value="https://www.everyayah.com/data/MaherAlMuaiqly128kbps/">ماهر المعيقلي</option>
                <option value="https://www.everyayah.com/data/Saad_Al-Ghamdi_128kbps/">سعد الغامدي</option>
            </select>
        </div>
    </header>

    <div class="quran-container">
        <div class="page-view-box">
            <img id="quranPageImg" class="quran-page-img" alt="لاپەڕەی قورئان">
        </div>

        <div class="page-nav-bar">
            <button class="nav-btn" onclick="nextPage()">پاشتر ◀</button>
            
            <div class="page-indicator-box">
                <input type="number" id="jumpInput" class="jump-input" min="1" max="604" onchange="jumpToPage(this.value)" title="ژمارەی لاپەڕە بنوسە">
                <div class="page-indicator" id="pageIndicator">لاپەڕە ١</div>
            </div>

            <button class="nav-btn" onclick="prevPage()">▶ پێشتر</button>
        </div>
    </div>

    <div class="player-bar">
        <div class="player-info">
            <span id="playingTitle">خوێندنەوەی لاپەڕە ١</span>
            <span style="cursor: pointer; color: #ff6b6b;" onclick="togglePlay()">وەستان / لێدان</span>
        </div>
        <audio id="audioPlayer" controls autoplay></audio>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 604;
        const imgElement = document.getElementById('quranPageImg');
        const indicator = document.getElementById('pageIndicator');
        const jumpInput = document.getElementById('jumpInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const playingTitle = document.getElementById('playingTitle');
        const reciterSelect = document.getElementById('reciterSelect');

        function updatePage() {
            let paddedNum = String(currentPage).padStart(3, '0');
            
            // بەکارهێنانی باشترین و خێرا ترین سێرვەری وێنەی موسحەف
            imgElement.src = `https://www.quranparadise.com/quran-images/page${currentPage}.png`;
            
            imgElement.onerror = function() {
                imgElement.src = `https://everyayah.com/data/images/v1/${currentPage}.png`;
            };

            indicator.innerText = `لاپەڕە ${currentPage}`;
            jumpInput.value = currentPage;
            playingTitle.innerText = `خوێندنەوەی لاپەڕە ${currentPage}`;

            updateAudio();
        }

        function updateAudio() {
            let paddedNum = String(currentPage).padStart(3, '0');
            let audioBaseUrl = reciterSelect.value;
            audioPlayer.src = `${audioBaseUrl}${paddedNum}.mp3`;
            audioPlayer.play().catch(e => console.log("Audio waiting..."));
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePage();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePage();
            }
        }

        function jumpToPage(val) {
            let pageNum = parseInt(val);
            if (pageNum >= 1 && pageNum <= totalPages) {
                currentPage = pageNum;
                updatePage();
            } else {
                jumpInput.value = currentPage;
            }
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        function changeTheme() {
            let theme = document.getElementById('themeSelect').value;
            document.body.className = theme;
        }

        // کارپێکردنی سەرەتایی
        updatePage();
    </script>
</body>
</html>
