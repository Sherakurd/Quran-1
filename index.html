<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>قورئانی پیرۆز - ٦٠٤ لاپەڕە</title>
    <style>
        @font-face {
            font-family: 'Rudaw';
            src: url('https://raw.githubusercontent.com/username/repository/main/RudawRegular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary: #1b4332;
            --secondary: #2d6a4f;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2d3748;
        }
        body {
            font-family: 'Rudaw', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            direction: rtl;
            padding-bottom: 110px;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        .selector-box {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: var(--secondary);
            display: block;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            background: #fff;
            font-family: 'Rudaw', sans-serif;
        }
        .page-card {
            background: var(--card-bg);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-card:active {
            transform: scale(0.98);
        }
        .page-info h3 {
            margin: 0 0 4px 0;
            font-size: 17px;
        }
        .page-info p {
            margin: 0;
            color: #718096;
            font-size: 13px;
        }
        .page-number {
            background-color: #e8f5e9;
            color: var(--secondary);
            width: 45px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 12px 20px;
            box-shadow: -4px 10px rgba(0,0,0,0.05);
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }
        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <header>قورئانی پیرۆز - بە پێی لاپەڕە</header>

    <div class="container">
        <div class="selector-box">
            <label for="reciterSelect">قورئانخوێن هەڵبژێرە:</label>
            <select id="reciterSelect">
                <!-- بەشی معەلمین و گشت قورئانخوێنەکان -->
                <option value="https://www.everyayah.com/data/Minshawy_Teacher_128kbps/">محەمەد سێدیق ئەلمنشاوی (موعەلم - بۆ لەبەرکردن)</option>
                <option value="https://www.everyayah.com/data/Husary_Teacher_128kbps/">مەحموود خەلیل الحصري (موعەلم)</option>
                <option value="https://www.everyayah.com/data/Alafasy_128kbps/">میشاری ڕاشد العفاسی</option>
                <option value="https://www.everyayah.com/data/Abdul_Basit_Murattal_192kbps/">عبدالباسط عبدالصمد (مرتل)</option>
                <option value="https://www.everyayah.com/data/MaherAlMuaiqly128kbps/">مەهر ئەلمەیقلی</option>
                <option value="https://www.everyayah.com/data/Saood_ash-Shuraym_128kbps/">سەعوود الشریم</option>
                <option value="https://www.everyayah.com/data/Yasser_Ad-Dussary_128kbps/">یاسیر الدوسری</option>
            </select>
        </div>

        <div id="pageList"></div>
    </div>

    <div class="player-bar" id="playerBar">
        <div class="player-info">
            <span id="playingTitle">لاپەڕە هەڵبژێرە</span>
            <span id="closePlayer" style="color: red; cursor: pointer;">✕</span>
        </div>
        <audio id="audioPlayer" controls autoplay></audio>
    </div>

    <script>
        const listContainer = document.getElementById('pageList');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerBar = document.getElementById('playerBar');
        const playingTitle = document.getElementById('playingTitle');
        const reciterSelect = document.getElementById('reciterSelect');

        // دروستکردنی لیستی 604 لاپەڕەکەی قورئان بە شێوازی خودکار
        function renderPages() {
            listContainer.innerHTML = '';
            for (let i = 1; i <= 604; i++) {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.innerHTML = `
                    <div class="page-info">
                        <h3>لاپەڕەی ${i}</h3>
                        <p>قورئانی پیرۆز - موسحەفی مەدینە</p>
                    </div>
                    <div class="page-number">ل ${i}</div>
                `;
                card.onclick = () => playPage(i);
                listContainer.appendChild(card);
            }
        }

        function playPage(pageNum) {
            const baseUrl = reciterSelect.value;
            // بەستەری فلتەری پەڕەکان لە سیستمە جیهانییەکاندا بە شێوازی 3 ژمارەیی ڕێکخراوە (مثل 001, 002... 604)
            let formattedNum = String(pageNum).padStart(3, '0');
            
            // تێبینی: سێرڤەری تایتڵەکان فۆرماتی پەڕەیان وەک (Surah+Ayah) یان ژمارەی پاکی پەڕە بەکاردێنێت
            // لێرەدا فۆرماتی ستانداردی پەڕەکان (Page number) بەکارهاتووە بۆ سێرڤەری دەنگی
            const audioUrl = `${baseUrl}${formattedNum}.mp3`;
            
            playingTitle.innerText = `لاپەڕەی ${pageNum}`;
            audioPlayer.src = audioUrl;
            playerBar.style.display = 'flex';
            audioPlayer.play();
        }

        document.getElementById('closePlayer').onclick = () => {
            audioPlayer.pause();
            playerBar.style.display = 'none';
        };

        renderPages();
    </script>
</body>
</html>
